name: lpp
description: LectioPlusPlus the newest free alternative to wack paid Lectio apps.

publish_to: 'none'

version: 1.0.13+1

environment:
  sdk: '>=3.0.0 >=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  eva_icons_flutter: ^3.1.0
  shared_preferences: ^2.0.15
  lectio_wrapper: ^0.6.59
  flutter_week_view: ^1.3.0
  date_format: ^2.0.7
  url_launcher: ^6.1.11
  flutter_bloc: ^8.0.0
  package_info_plus: ^4.2.0
  flutter_secure_storage: ^8.0.0
  intl: ^0.19.0
  google_mobile_ads: ^5.1.0
  webview_flutter: ^4.2.2
  freezed_annotation: ^2.4.1
  flutter_local_notifications: ^15.1.0+1
  open_filex: ^4.3.2
  path_provider: ^2.0.15
  workmanager: ^0.5.1
  flutter_native_splash: ^2.3.1
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2
  rich_text_editor_controller: ^0.0.4
  flutter_svg: ^1.1.6
  app_tracking_transparency: ^2.0.4
  upgrader: ^8.2.0
  community_charts_flutter: ^1.0.2
  page_transition: ^2.1.0
  flutter_speed_dial: ^7.0.0
  in_app_purchase: ^3.2.0
  aura_box: ^1.0.2
  json_annotation: ^4.9.0
  dots_indicator: ^3.0.0
  appsflyer_sdk: ^6.14.3
  intl_translation: ^0.20.0
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  freezed: ^2.5.2
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/lpp.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/illustrations/
    
flutter_native_splash:
  color: "#ff7a00"
  image: assets/icons/lpp.png
  android_12: